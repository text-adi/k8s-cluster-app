apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obsidian
  namespace: argocd
spec:
  project: apps
  sources:
    - repoURL: 'https://github.com/text-adi/k8s-cluster-app.git'
      targetRevision: dev
      path: infrastructure/charts/obsidian
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: app-obsidian
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
