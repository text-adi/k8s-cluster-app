{{- if and .Values.mqtt2prometheus.enabled .Values.mqtt2prometheus.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mqtt2prometheus.serviceAccountName" . }}
  labels:
    {{- include "mqtt2prometheus.labels" . | nindent 4 }}
  {{- with .Values.mqtt2prometheus.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.mqtt2prometheus.serviceAccount.automount }}
{{- end }}
