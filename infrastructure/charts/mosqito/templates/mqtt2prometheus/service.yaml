{{- if .Values.mqtt2prometheus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mqtt2prometheus.fullname" . }}
  labels:
    {{- include "mqtt2prometheus.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mqtt2prometheus.service.type }}
  selector:
    {{- include "mqtt2prometheus.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mqtt2prometheus.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
