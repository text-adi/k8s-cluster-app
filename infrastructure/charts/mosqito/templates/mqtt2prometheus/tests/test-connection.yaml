{{- if .Values.mqtt2prometheus.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mqtt2prometheus.fullname" . }}-test-connection"
  labels:
    {{- include "mqtt2prometheus.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "mqtt2prometheus.fullname" . }}:{{ .Values.mqtt2prometheus.service.port }}']
  restartPolicy: Never
{{- end }}
