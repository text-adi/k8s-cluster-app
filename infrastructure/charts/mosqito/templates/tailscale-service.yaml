{{- if .Values.tailscale.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-tailscale
  annotations:
    tailscale.com/proxy-group: {{ .Values.tailscale.proxyGroup }}
    tailscale.com/hostname: {{ .Values.tailscale.hostname }}
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    {{- include "mosquitto.selector" . | nindent 4 }}
  ports:
    - name: mqtt
      port: {{ .Values.tailscale.port }}
      targetPort: mqtt
{{- end }}