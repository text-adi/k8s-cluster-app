---
mosquitto:
  persistence:
    enabled: true
    size: 1Gi

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  config: |
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    listener 1883
    listener 9090
    protocol websockets
    allow_anonymous true

  monitoring:
    sidecar:
      enabled: true
    podMonitor:
      enabled: true

tailscale:
  enabled: true
  hostname: mosqito
  proxyGroup: ingress-ha
  port: 1883
