---
couchdb:
  couchdbConfig:
    couchdb:
      uuid: b5833f0fff5040348bdf62dc498bc8fb
    chttpd:
      bind_address: 0.0.0.0
      enable_cors: true
    cors:
      credentials: true
      origins: "app://obsidian.md,capacitor://localhost,http://localhost"
      methods: "GET,PUT,POST,HEAD,DELETE"
      headers: "accept, authorization, content-type, origin, referer"

  createAdminSecret: true

  autoSetup:
    enabled: true
    defaultDatabases:
      - _global_changes
      - _replicator
      - _users

  ingress:
    enabled: true
    className: tailscale
    annotations:
      tailscale.com/proxy-group: ingress-ha
      tailscale.com/hostname: obsidian
    hosts:
      - obsidian.pleco-blenny.ts.net
    tls:
      - hosts:
          - obsidian.pleco-blenny.ts.net
